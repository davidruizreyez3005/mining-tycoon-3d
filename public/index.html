<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="3D Mobile Mining Tycoon Game">
  <title>3D Miner Mania</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: #f39c12;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
    }
    
    .loading-bar-container {
      width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    
    #loading-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f39c12, #e74c3c);
      transition: width 0.3s ease;
    }
    
    #loading-text {
      margin-top: 1rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }
    
    /* HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
      display: none;
    }
    
    .hud-panel {
      position: absolute;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 16px;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    #top-bar {
      top: env(safe-area-inset-top, 10px);
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .stat-icon {
      font-size: 1.2rem;
    }
    
    .stat-value {
      font-weight: bold;
      color: #f39c12;
    }
    
    #money-display {
      font-size: 1.3rem;
      color: #2ecc71;
    }
    
    #bottom-controls {
      bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    
    .action-btn {
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    
    .action-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(243, 156, 18, 0.4);
    }
    
    #mine-btn {
      font-size: 1.3rem;
      padding: 20px 32px;
    }
    
    .secondary-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    #notification-area {
      position: fixed;
      top: calc(env(safe-area-inset-top, 10px) + 80px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    
    .notification {
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      animation: slideDown 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
      border-left: 4px solid #f39c12;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeOut {
      to {
        opacity: 0;
      }
    }
    
    /* Pause menu */
    #pause-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 300;
      pointer-events: auto;
    }
    
    #pause-menu.visible {
      display: flex;
    }
    
    .menu-content {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      border: 2px solid rgba(243, 156, 18, 0.3);
    }
    
    .menu-title {
      font-size: 1.8rem;
      color: #f39c12;
      margin-bottom: 20px;
    }
    
    .menu-btn {
      display: block;
      width: 200px;
      margin: 10px auto;
      padding: 12px 24px;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    
    .menu-btn:active {
      transform: scale(0.95);
    }
    
    .menu-btn.secondary {
      background: rgba(255,255,255,0.1);
    }
    
    /* Info panel */
    #info-panel {
      top: calc(env(safe-area-inset-top, 10px) + 80px);
      right: 10px;
      min-width: 150px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 0.85rem;
    }
    
    .info-label {
      color: rgba(255,255,255,0.6);
    }
    
    .info-value {
      color: #f39c12;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">⛏️ Miner Mania</div>
    <div class="loading-bar-container">
      <div id="loading-progress"></div>
    </div>
    <div id="loading-text">Loading...</div>
  </div>
  
  <!-- Canvas Container -->
  <div id="canvas-container"></div>
  
  <!-- HUD -->
  <div id="hud">
    <!-- Top Bar -->
    <div id="top-bar" class="hud-panel">
      <div class="stat-item">
        <span class="stat-icon">💰</span>
        <span id="money-display">$100</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">📊</span>
        <span id="depth-display">Depth: 0m</span>
      </div>
      <button id="pause-btn" class="action-btn secondary-btn" style="padding: 8px 16px;">⏸️</button>
    </div>
    
    <!-- Info Panel -->
    <div id="info-panel" class="hud-panel">
      <div class="info-row">
        <span class="info-label">Storage:</span>
        <span class="info-value" id="storage-display">0/100</span>
      </div>
      <div class="info-row">
        <span class="info-label">Production:</span>
        <span class="info-value" id="production-display">0/min</span>
      </div>
      <div class="info-row">
        <span class="info-label">Workers:</span>
        <span class="info-value" id="workers-display">0</span>
      </div>
    </div>
    
    <!-- Bottom Controls -->
    <div id="bottom-controls">
      <button id="upgrade-btn" class="action-btn secondary-btn">⬆️ Upgrades</button>
      <button id="mine-btn" class="action-btn">⛏️ MINE</button>
    </div>
  </div>
  
  <!-- Notification Area -->
  <div id="notification-area"></div>
  
  <!-- Pause Menu -->
  <div id="pause-menu">
    <div class="menu-content">
      <h2 class="menu-title">Game Paused</h2>
      <button class="menu-btn" onclick="togglePause()">▶️ Resume</button>
      <button class="menu-btn secondary" onclick="resetGame()">🔄 New Game</button>
      <button class="menu-btn secondary" onclick="saveAndExit()">💾 Save & Exit</button>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
  
  <script>
    // Expose togglePause globally for pause menu
    window.togglePause = function() {
      const pauseMenu = document.getElementById('pause-menu');
      if (pauseMenu) {
        pauseMenu.classList.remove('visible');
      }
      // Trigger resume in main.ts
      window.dispatchEvent(new CustomEvent('resume-game'));
    };
    
    window.resetGame = function() {
      localStorage.removeItem('mining_tycoon_save');
      location.reload();
    };
    
    window.saveAndExit = function() {
      window.dispatchEvent(new CustomEvent('save-game'));
      setTimeout(() => {
        alert('Game saved! You can close this tab.');
      }, 500);
    };
  </script>
</body>
</html>
