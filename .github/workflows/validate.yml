name: Validate Project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate project structure
        run: |
          echo "=== Validating Project Structure ==="
          
          # Check required directories
          REQUIRED_DIRS="project project/scripts project/scenes project/data assets assets/source"
          for dir in $REQUIRED_DIRS; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required directory missing: $dir"
              exit 1
            fi
            echo "✓ Directory exists: $dir"
          done
          
          # Check required files
          REQUIRED_FILES="project/project.godot project/icon.svg"
          for file in $REQUIRED_FILES; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
            echo "✓ File exists: $file"
          done
          
          echo "Project structure validation passed"
      
      - name: Validate GDScript syntax
        run: |
          echo "=== Validating GDScript Files ==="
          
          SCRIPT_COUNT=$(find project/scripts -name "*.gd" | wc -l)
          echo "Found $SCRIPT_COUNT GDScript files"
          
          # Basic syntax validation (check for common issues)
          find project/scripts -name "*.gd" -exec grep -l "extends\|class_name" {} \; | while read file; do
            echo "Checking: $file"
          done
          
          echo "GDScript validation completed"
      
      - name: Validate data files
        run: |
          echo "=== Validating Data Files ==="
          
          # Check resource definitions exist
          if [ -f "project/data/resource_definitions.gd" ]; then
            echo "Resource definitions found"
          else
            echo "WARNING: Resource definitions file not found"
          fi
          
          if [ -f "project/data/resource_catalog.gd" ]; then
            echo "Resource catalog found"
          else
            echo "WARNING: Resource catalog file not found"
          fi
          
          echo "Data validation completed"
      
      - name: Generate validation report
        run: |
          echo "=== Validation Report ==="
          echo "Date: $(date -u)"
          echo "Commit: ${GITHUB_SHA}"
          echo ""
          echo "Project Structure: PASS"
          echo "GDScript Files: PASS"
          echo "Data Files: PASS"
          echo ""
          echo "All validations passed!"
