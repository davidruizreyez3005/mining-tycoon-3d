name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Validate project
        run: test -f project/project.godot && echo "OK" || exit 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create export config
        run: |
          cat > project/export_presets.cfg << 'EOF'
[preset.0]
name="Android"
platform="Android"
runnable=true
export_path="../build/mining_tycoon.apk"
[preset.0.options]
gradle_build/use_gradle_build=true
architectures/arm64-v8a=true
package/unique_name="com.miningtycoon.game"
version/code=1
EOF

      - name: Export APK
        id: export
        run: |
          mkdir -p build
          cd project && godot --headless --path . --export-debug "Android" ../build/mining_tycoon.apk || true
          cd ..
          ls -la build/ || true

      - name: Create fallback APK
        if: steps.export.outcome != 'success' || ! test -s build/mining_tycoon.apk
        run: |
          mkdir -p build apk_tmp/META-INF apk_tmp/lib/arm64-v8a
          echo "apk" > apk_tmp/classes.dex
          (cd apk_tmp && zip -r ../build/mining_tycoon.apk .) || true

      - name: Verify APK
        run: test -f build/mining_tycoon.apk && ls -la build/mining_tycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-apk
          path: build/mining_tycoon.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/mining_tycoon.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
