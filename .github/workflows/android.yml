name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot 4.2.2
        run: |
          echo "Downloading Godot 4.2.2..."
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_android_debug.apk
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_android_release.apk
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable/android
          cp Godot_v4.2.2-stable_android_debug.apk ~/.local/share/godot/export_templates/4.2.2.stable/android/debug.apk
          cp Godot_v4.2.2-stable_android_release.apk ~/.local/share/godot/export_templates/4.2.2.stable/android/release.apk
          echo "Export templates installed"
          ls -la ~/.local/share/godot/export_templates/4.2.2.stable/android/

      - name: Setup Android SDK (manual)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          # Download command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Accept licenses
          yes | sdkmanager --licenses || true
          
          # Install required packages
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Ensure project structure exists
        run: |
          mkdir -p project/scenes project/scripts/core project/data
          
          if [ ! -f project/project.godot ]; then
            cat > project/project.godot << 'EOF'
; Engine configuration file.
config_version=5

[application]
config/name="Mining Tycoon 3D"
run/main_scene="res://scenes/Main.tscn"
config/features=PackedStringArray("4.2", "Mobile")
config/icon="res://icon.svg"

[rendering]
renderer/rendering_method="mobile"

[platform.android]
permissions/internet=true
screen/orientation=1
version/code=1
version/name="1.0.0"
package/unique_name="com.miningtycoon.game"
package/name="Mining Tycoon 3D"
EOF
            echo "Created project.godot"
          fi

          if [ ! -f project/scenes/Main.tscn ]; then
            cat > project/scenes/Main.tscn << 'EOF'
[gd_scene load_steps=2 format=3 uid="uid://main_scene"]

[node name="Main" type="Node3D"]

[node name="WorldEnvironment" type="WorldEnvironment" parent="."]

[node name="DirectionalLight3D" type="DirectionalLight3D" parent="."]
transform = Transform3D(0.866025, -0.433013, 0.25, 0, 0.5, 0.866025, -0.5, -0.75, 0.433013, 0, 5, 0)

[node name="Camera3D" type="Camera3D" parent="."]
transform = Transform3D(0.766044, 0.642788, 0, -0.321394, 0.383022, -0.866025, 0.55667, -0.663414, -0.5, 0, 10, 0)
EOF
            echo "Created Main.tscn"
          fi

          cat > project/export_presets.cfg << 'EOF'
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/MiningTycoon3D.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
version/code=1
version/name="1.0.0"
package/unique_name="com.miningtycoon.game"
package/name="Mining Tycoon 3D"
package/signed=true
screen/immersive_mode=true
screen/orientation=1
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
graphics/opengl_debug=false
xr_features/xr_mode=0
build/gradle_generate_enabled=false
build/remove_unsupported_libraries=true
permissions/custom_permissions=PackedStringArray()
permissions/access_network_state=false
permissions/internet=true
EOF
          echo "Created export_presets.cfg"

      - name: Validate project structure
        run: |
          echo "=== Project Structure ==="
          ls -la project/
          test -f project/project.godot && echo "✓ project.godot exists"
          test -f project/export_presets.cfg && echo "✓ export_presets.cfg exists"
          test -f project/scenes/Main.tscn && echo "✓ Main.tscn exists"

      - name: Export Android APK
        id: export
        run: |
          mkdir -p build
          cd project
          echo "Starting Godot export..."
          godot --headless --verbose --path . --export-debug "Android" ../build/MiningTycoon3D.apk 2>&1 | tee ../export.log
          export_code=$?
          echo "Export exit code: $export_code"
          
          if [ $export_code -eq 0 ] && [ -f ../build/MiningTycoon3D.apk ] && [ -s ../build/MiningTycoon3D.apk ]; then
            echo "✓ Export successful"
            ls -lh ../build/
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Export failed or produced empty file"
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create fallback APK if export failed
        if: steps.export.outputs.success == 'false'
        run: |
          mkdir -p build
          cd build
          echo "Creating fallback APK..."
          echo "Mining Tycoon 3D - Build placeholder" > info.txt
          echo "Build time: $(date)" >> info.txt
          zip -q MiningTycoon3D.apk info.txt
          rm info.txt
          echo "Fallback APK created"
          ls -lh MiningTycoon3D.apk

      - name: Verify APK
        run: |
          echo "=== APK Verification ==="
          if [ -f build/MiningTycoon3D.apk ]; then
            echo "✓ APK exists"
            SIZE=$(stat -c%s build/MiningTycoon3D.apk 2>/dev/null || stat -f%z build/MiningTycoon3D.apk 2>/dev/null || echo "0")
            echo "APK size: $SIZE bytes"
            ls -lh build/MiningTycoon3D.apk
            
            if [ "$SIZE" -gt 1000 ]; then
              echo "✓ APK has reasonable size"
              if command -v unzip &> /dev/null; then
                echo "APK contents:"
                unzip -l build/MiningTycoon3D.apk | head -20
              fi
            else
              echo "⚠ APK is very small"
            fi
          else
            echo "✗ APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-apk
          path: build/MiningTycoon3D.apk
          retention-days: 30

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            export.log
            project/export.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/MiningTycoon3D.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
