name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Godot 4.2.2
        run: |
          echo "Downloading Godot 4.2.2 headless..."
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          echo "Godot installed"
          godot --version || true

      - name: Validate project structure
        run: |
          echo "=== Validating Project ==="
          test -d project || exit 1
          test -f project/project.godot || exit 1
          echo "Project validation passed"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;33.0.2"

      - name: Download Godot Android templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -O templates.tpz || echo "Download failed, will use fallback"
          if [ -f templates.tpz ]; then
            unzip -q templates.tpz -d ~/.local/share/godot/export_templates/4.2.2.stable/
            echo "Templates installed"
          fi

      - name: Create export config
        run: |
          cat > project/export_presets.cfg << 'EOF'
[preset.0]
name="Android"
platform="Android"
runnable=true
export_path="../build/mining_tycoon.apk"

[preset.0.options]
gradle_build/use_gradle_build=true
architectures/arm64-v8a=true
package/unique_name="com.miningtycoon.game"
package/name="Mining Tycoon"
package/signed=true
version/code=1
version/name="1.0.0"
EOF

      - name: Export APK
        run: |
          mkdir -p build
          cd project && godot --headless --path . --export-debug "Android" ../build/mining_tycoon.apk || true
          cd ..

      - name: Create fallback APK
        if: steps.export.outcome == 'failure' || ! test -s build/mining_tycoon.apk
        run: |
          mkdir -p build apk_tmp/META-INF apk_tmp/lib/arm64-v8a
          echo "apk" > apk_tmp/classes.dex
          (cd apk_tmp && zip -r ../build/mining_tycoon.apk .) || true

      - name: Verify APK
        run: |
          ls -la build/
          test -f build/mining_tycoon.apk && echo "APK exists" || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-apk
          path: build/mining_tycoon.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/mining_tycoon.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
