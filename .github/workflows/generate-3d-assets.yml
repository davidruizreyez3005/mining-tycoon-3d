name: Generate 3D Assets

on:
  push:
    branches: [main, master]
    paths:
      - 'assets/source/**'
      - 'scripts/generate-assets/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'assets/source/**'
      - 'scripts/generate-assets/**'
  workflow_dispatch:

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      
      - name: Verify Blender installation
        run: blender --version
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create asset directories
        run: |
          mkdir -p assets/models
          mkdir -p assets/collisions
          mkdir -p assets/textures
      
      - name: Run asset generators
        run: |
          if [ -d "scripts/generate-assets" ]; then
            for script in scripts/generate-assets/*.py; do
              if [ -f "$script" ]; then
                echo "Running $script"
                blender --background --python "$script"
              fi
            done
          else
            echo "No asset generator scripts found"
          fi
      
      - name: Validate GLB files
        run: |
          if [ -d "assets/models" ] && [ "$(ls -A assets/models/*.glb 2>/dev/null)" ]; then
            npx gltf-validator assets/models/*.glb || echo "Validation completed with warnings"
          else
            echo "No GLB files to validate"
          fi
      
      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: assets/models/
          retention-days: 7
